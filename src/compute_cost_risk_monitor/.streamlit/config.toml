# Streamlit settings for the local dashboard (Phase 4 design D11, D12, D31).
# Streamlit reads this file because it sits beside the app script, whatever folder the
# dashboard is launched from:
#   uv run streamlit run src/compute_cost_risk_monitor/app.py

[browser]
# Send no usage statistics to Streamlit.
gatherUsageStats = false

[server]
# Listen on this PC only: live Azure figures stay local (PROJECT.md §6).
# Setting an address also skips the startup banner's IP lookups.
address = "127.0.0.1"

[client]
# Hide developer options, including the Deploy button.
toolbarMode = "viewer"

[theme]
# One dark desk theme (Phase 7 design D4, D10, D13, D26, D31). The colours are
# mirrored in `dashboard.COLOURS`, which tests/repo/test_streamlit_config.py checks
# against this table, so the charts and the scenario grid use the same values.
# Streamlit's bundled fonts only: no fontFaces and no static serving.
base = "dark"
backgroundColor = "#0E1116"
secondaryBackgroundColor = "#161B22"
textColor = "#E6E8EB"
# The steel-blue accent: the active tab and the entered grid column only.
primaryColor = "#7AA2D6"
linkColor = "#7AA2D6"
# Control borders at 3:1 or more against both backgrounds; table rules stay quiet.
borderColor = "#646E7C"
showWidgetBorder = true
dataframeBorderColor = "#2A313C"
dataframeHeaderBackgroundColor = "#161B22"
baseFontSize = 14
baseRadius = "4px"
# Red marks an added cost and green a saving, always with the sign. Amber marks
# data labels and the stale warning. The text variants match, so markdown and
# table colours agree.
redColor = "#EF6B63"
redTextColor = "#EF6B63"
greenColor = "#5CC98A"
greenTextColor = "#5CC98A"
orangeColor = "#F2CC60"
orangeTextColor = "#F2CC60"
yellowColor = "#F2CC60"
yellowTextColor = "#F2CC60"
blueColor = "#7AA2D6"
blueTextColor = "#7AA2D6"
grayColor = "#9AA3AE"
grayTextColor = "#9AA3AE"
chartCategoricalColors = ["#E6E8EB", "#9AA3AE", "#7AA2D6"]
