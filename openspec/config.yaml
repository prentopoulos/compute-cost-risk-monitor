schema: spec-driven

context: |
  Compute Cost & Risk Monitor: answers which comparable GPU rental offers are available, what a workload would cost, and how exposed a compute budget is to changing prices, using observed marketplace asking prices (starting with Vast.ai).
  Read PROJECT.md for current scope and WORKFLOW.md for the phase workflow.
  Stack: Python 3.13, pandas, DuckDB, Streamlit, pytest; uv with uv.lock; Ruff, strict mypy. Gate: uv run --frozen python scripts/gate.py.
  Phases 1-7 follow PROJECT.md section 6: schema and acceptance, Vast.ai collector, normalization and quality checks, dashboard, workload costs and exposure scenarios, tests, public demo.
  Data is observed marketplace asking prices, never executed trades or a market-wide benchmark. Exposure figures are labelled scenario calculations, not forecasts.
  Compare offers only within a comparable group (GPU variant, GPU count, region, rental type); normalize to USD/GPU-hour and state cost exclusions.
  Keep original API responses with retrieval time. Missing data stays missing. Flag duplicates, stale offers and thin samples.
  Deterministic code computes all prices, costs and exposure. An optional AI agent may only draft the market brief from validated numbers.
  The collector only reads offers; never rent, create or change instances.
  Tests use synthetic or recorded fixtures with no network or credentials.
  Gated in PROJECT.md: live source reads, scheduled collection, paid calls, publishing or making the repo public.
  Remote: private GitHub repo prentopoulos/compute-cost-risk-monitor. One branch and PR per phase; code PRs are reviewed before merge.
  Operator resolves PROJECT.md ⛔ gates; never waive them autonomously.
  Never fabricate external results. Label mocked, local and live results accurately.

rules:
  proposal:
    - State which PROJECT.md phase this change implements.
    - Include a Non-goals section.
  design:
    - Designs that use paid or external services name the operator-approved budget and gate.
    - Offline phases have no live credential, network submission or secret dependency.
    - Any new price, cost or exposure figure names its comparable-group key, units and exclusions.
  tasks:
    - Keep tasks independently committable or group closely related tasks logically.
