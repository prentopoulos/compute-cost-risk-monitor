[project]
name = "compute-cost-risk-monitor"
version = "0.1.0"
description = "Comparable GPU VM options, workload costs and budget exposure from published Azure retail list prices."
authors = [{ name = "Peter Rentopoulos" }]
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3,<7",
    "duckdb>=1.5",
    "pandas>=3.0",
    "pytz>=2026.5",
    "streamlit>=1.65",
]

[dependency-groups]
dev = [
    "commitizen>=4.19",
    "detect-secrets>=1.5",
    "hypothesis>=6.169",
    "mypy>=2.4",
    "pandas-stubs==3.0.*",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17",
    "types-pytz>=2026.5",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13"

[tool.ruff]
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "DTZ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
# Test helpers in tests/support.py import as `support`.
mypy_path = "tests"

[tool.pytest]
strict = true
testpaths = ["tests"]
pythonpath = ["tests"]
# Tests never touch the network (pytest-socket); Unix socket pairs stay allowed.
addopts = ["-ra", "--import-mode=importlib", "--disable-socket", "--allow-unix-socket"]

[tool.coverage.run]
branch = true
source = ["compute_cost_risk_monitor"]

[tool.commitizen]
name = "cz_conventional_commits"
